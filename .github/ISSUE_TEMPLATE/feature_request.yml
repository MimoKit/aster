name: 功能建议
description: 提一个想加的能力
title: '[建议] '
labels: ['类型: 功能', '状态: 待确认']
body:
  - type: markdown
    attributes:
      value: |
        建议描述得越具体越好。如果有别的框架已经实现了，贴个链接或截图会很有帮助。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先说场景，再说方案。避免只写「加个 XXX」
      placeholder: |
        现在插件要在群里做需要权限的操作时，得自己在 handler 里判断 sender.role。
        希望框架能提供一个现成的判断方法。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      placeholder: |
        `ctx` 上暴露 `isAdmin()` / `isOwner()` 两个方法。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
      description: 你试过什么绕过方案？为什么不够好？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 插件 API
        - 适配器（OneBot v11）
        - 命令行
        - WebUI
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 参考实现
      description: 别的框架怎么做的？附链接或截图
      placeholder: |
        Yunzai 的 plugin 基类有 conKey/setContext 这类便利方法。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已经搜索过现有 issue 与文档，没有重复
          required: true
        - label: 愿意自己提 PR 实现
          required: false
