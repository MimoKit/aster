# Aster 配置
# 首次运行时，本文件会被复制到工作目录下的 config.toml（不会覆盖已存在的配置）

[bot]
name = "Aster"
# 机器人主人账号，拥有所有插件权限（可填多个）
masters = []
# 是否加载内置插件（目前是 as 状态查询）
builtin_plugins = true
# 命令强制前缀，留空则命令直接以命令词开头（如 as）
# 需要 #as 风格时改成 "#"
command_prefix = ""

[log]
# trace | debug | info | warn | error | off
level = "info"
# 单条日志中打印的字符串最大长度
max_len = 4096
# 打印完整 base64:// 内容（默认折叠，避免刷屏）
show_base64 = false

[onebot11]
enable = true
# 监听地址，0.0.0.0 表示所有网卡
host = "0.0.0.0"
# 监听端口（适配器反向连接本端口；如需 531/0531 则需要特权权限）
port = 5310
# WebSocket 挂载路径，适配器需连接 ws://host:port/onebot/v11/ws
path = "/onebot/v11/ws"
# 正向 / 反向鉴权 Token，为空表示不校验。
# 适配器可放在 Authorization 头、access_token 查询参数或 {"access_token": "..."} 字段中
access_token = ""
# 允许连接的适配器 IP，为空表示不限制
trusted_ips = []
# 心跳超时（秒），超时未收到任何数据则断开
heartbeat_timeout = 90
# 等待适配器主动上报 lifecycle 事件的超时（秒）
handshake_timeout = 10
# 发送 API 请求后等待 echo 回执的超时（秒）
request_timeout = 60

[webui]
# 是否启用网页控制台与 HTTP API
enable = true
# 监听地址，默认仅本机可访问
host = "127.0.0.1"
# 监听端口
port = 5311
# 访问令牌，为空则不校验（对外暴露时必须设置）
access_token = ""
# 内存中保留的日志条数，供日志页回看
log_capacity = 2000
